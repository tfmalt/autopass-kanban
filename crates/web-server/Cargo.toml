[package]
name = "kanban-web-server"
edition.workspace = true
license.workspace = true
version.workspace = true
build = "build.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
futures.workspace = true
include_dir.workspace = true
kanban-core = { path = "../core" }
mime_guess.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
ts-rs.workspace = true

[build-dependencies]
# Build-time asset fingerprinting and precompression (US-034). These never
# become runtime dependencies of the shipped binary.
flate2.workspace = true
sha2.workspace = true

[dev-dependencies]
kanban-core = { path = "../core", features = ["test-support"] }
tempfile.workspace = true
# `test-util` provides the paused clock the change-coalescing tests use instead
# of real sleeps. Test-only, so it does not reach the shipped binary.
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true
